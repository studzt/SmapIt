name: .NET Debug

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet --version
        dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore
